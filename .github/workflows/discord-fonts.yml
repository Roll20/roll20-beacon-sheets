name: Process and Upload Fonts

on:
  push:
    branches:
      - staging
      - main
    paths:
      - '**.css'

jobs:
  # Runs a script from the repository, so it must never hold cloud
  # credentials. Its only output is the artifact handed to the upload job.
  process-fonts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install required tools
        run: sudo apt-get update && sudo apt-get install -y zsh perl curl

      - name: Process Font URLs
        run: |
          chmod +x ./process-fonts.sh
          CLIENT_ID=${{ github.ref_name == 'main' && '1199271093882589195' || '1199270539278164008' }}
          DISCORD_ACTIVITY_CLIENT_ID=$CLIENT_ID \
          ./process-fonts.sh --no-prompt --output-dir ${{ runner.temp }}/sheet-fonts

      - name: Upload fonts artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheet-fonts
          path: ${{ runner.temp }}/sheet-fonts
          if-no-files-found: error
          retention-days: 1

  # Holds the cloud credential and runs nothing from the repository.
  upload-fonts:
    needs: process-fonts
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download fonts artifact
        uses: actions/download-artifact@v4
        with:
          name: sheet-fonts
          path: ${{ runner.temp }}/sheet-fonts

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_KEYFILE }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Upload to GCS
        run: |
          ENV_PATH="${{ github.ref_name == 'main' && 'production' || 'staging' }}"

          # Sync the entire fonts directory
          gcloud storage rsync \
            --project=roll20-actual \
            ${{ runner.temp }}/sheet-fonts \
            "gs://roll20-cdn/roll20-beacon-sheets/fonts/$ENV_PATH" \
            --recursive \
            --cache-control="no-cache"
